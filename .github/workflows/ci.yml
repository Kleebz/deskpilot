# Every check that can run without a desktop.
#
# Phone checks use disposable HTTP/WebSocket fixtures. Headless and preview API
# checks also exercise the compiled artifact people actually install.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck
        run: deno check server/server.ts

      - name: Unit tests
        run: deno test --allow-read --allow-write --allow-env --allow-run=sh tests/

      - name: Shell syntax
        run: for f in shell/*.sh scripts/*.sh tests/*.sh; do bash -n "$f" || exit 1; done

  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Dependencies
        # tmux because it is the substrate; bubblewrap for the headless sandbox;
        # chromium for the layout measurements.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux bubblewrap chromium-browser
          npm --prefix web ci

      - name: Build the binary
        run: shell/build.sh dist /usr/share/deskpilot/scripts

      - name: Real tmux terminal recovery
        run: deno run -A tests/terminal-recovery.ts

      - name: Task image publishing without a desktop
        run: deno run -A tests/previews.ts dist/deskpilot

      - name: Phone image previews
        run: deno run -A tests/previews-mobile.ts

      - name: Desktop conversation chooser
        run: deno run -A tests/conversations-mobile.ts

      - name: Stable source identity and shared organization
        run: |
          deno run -A tests/organization-api.ts
          deno run -A tests/spaces-runtime.ts

      - name: Notification watcher lifecycle
        run: deno run -A tests/watcher.ts

      - name: A host with no desktop
        # The ubuntu runner has no compositor at all, so this is the real case
        # rather than a simulation of it.
        run: tests/headless.sh dist/deskpilot

      - name: Phone Spaces workflows and layout
        run: |
          deno run -A tests/spaces-mobile.ts
          deno run -A tests/ui-updates.ts
          deno run -A tests/scanner.ts

      - uses: actions/upload-artifact@v7
        with:
          name: deskpilot-binary
          path: dist/
          retention-days: 7
