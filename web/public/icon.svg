<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- deskpilot, in the desktop's own Cyberpunk Cyan palette: a screen with two
       tiled panes, one lit, over the rail indicator dots. -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0a0a0f"/>
  <g filter="url(#glow)">
    <rect x="96" y="120" width="320" height="212" rx="20"
          fill="none" stroke="#00ffff" stroke-width="18"/>
    <rect x="136" y="160" width="112" height="132" rx="10" fill="#00ffff" opacity="0.28"/>
    <rect x="264" y="160" width="112" height="132" rx="10" fill="#00ffff"/>
    <g fill="#00ffff">
      <circle cx="196" cy="404" r="13" opacity="0.3"/>
      <circle cx="256" cy="404" r="13"/>
      <circle cx="316" cy="404" r="13" opacity="0.3"/>
    </g>
  </g>
</svg>
