<div id="dp-nav-review" class="viz-carousel viz-dotted-background" aria-label="Deskpilot navigation designs">
  <section data-variant="Herdr inline" aria-label="Herdr spaces expanded inside Work"><div class="dp-stage"><div class="dp-phone" data-layout="grouped" aria-label="Deskpilot with inline Herdr"></div></div></section>
  <section data-variant="Herdr space browser" aria-label="Herdr spaces opened from Work" hidden><div class="dp-stage"><div class="dp-phone" data-layout="spaces" aria-label="Deskpilot with Herdr space browser"></div></div></section>
</div>
<style>
  #dp-nav-review .dp-stage { padding:18px 10px 0; min-height:1086px; display:flex; justify-content:center; align-items:flex-start; }

    --dp-line:light-dark(#cdd8df,#283044); --dp-accent:light-dark(#006d78,#00ffff);
    --dp-tint:light-dark(#e3f2f3,#13252c); --dp-warn:light-dark(#805400,#ffd76a);
    --dp-danger:light-dark(#b11c43,#ff7396); --dp-pad:14px;
    color:var(--dp-ink); background:var(--dp-bg); font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
    border:1px solid var(--dp-line); border-radius:22px; width:100%; max-width:390px; min-width:0; min-height:1050px;
    display:flex; flex-direction:column; overflow:clip; position:relative; color-scheme:light dark;

  #dp-nav-review .dp-phone .dp-brand { display:flex; align-items:center; justify-content:space-between; font-size:11px; margin-bottom:9px; color:var(--dp-muted); letter-spacing:.08em; }

  #dp-nav-review .dp-phone .dp-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #dp-nav-review .dp-phone .dp-heading-sub { margin-top:3px; }

  #dp-nav-review .dp-phone .dp-filter button { font-size:11px; flex:1; padding:9px 7px; background:transparent; }
  #dp-nav-review .dp-phone .dp-filter button[aria-pressed="true"] { color:var(--dp-accent); border-color:var(--dp-accent); background:var(--dp-tint); }
  #dp-nav-review .dp-phone .dp-stack { display:flex; flex-direction:column; gap:8px; }
  #dp-nav-review .dp-phone .dp-group { padding:0; border:1px solid var(--dp-line); border-radius:12px; background:var(--dp-surface); }
  #dp-nav-review .dp-phone .dp-group-head { width:100%; border:0; background:transparent; text-align:left; justify-content:flex-start; padding:13px 12px; }
  #dp-nav-review .dp-phone .dp-grow { flex:1; display:flex; flex-direction:column; align-items:flex-start; gap:3px; overflow-wrap:anywhere; }

  #dp-nav-review .dp-phone .dp-row { border:0; border-bottom:1px solid var(--dp-line); border-radius:0; width:100%; text-align:left; justify-content:flex-start; background:transparent; padding:var(--dp-pad) 12px; }
  #dp-nav-review .dp-phone .dp-row:last-child { border-bottom:0; }
  #dp-nav-review .dp-phone .dp-row-title { font-size:13px; color:var(--dp-ink); overflow-wrap:anywhere; }
  #dp-nav-review .dp-phone .dp-meta { color:var(--dp-muted); font-size:11px; display:flex; flex-wrap:wrap; gap:4px 9px; }
  #dp-nav-review .dp-phone .dp-state { font-size:11px; display:flex; align-items:center; gap:5px; }
  #dp-nav-review .dp-phone .dp-state::before { content:''; width:5px; height:5px; border-radius:50%; background:currentColor; flex:none; }
  #dp-nav-review .dp-phone .dp-blocked { color:var(--dp-warn); }
  #dp-nav-review .dp-phone .dp-working { color:var(--dp-accent); }
  #dp-nav-review .dp-phone .dp-done, #dp-nav-review .dp-phone .dp-ready { color:var(--dp-muted); }
  #dp-nav-review .dp-phone .dp-arrow { color:var(--dp-muted); font-size:20px; padding-left:5px; }
  #dp-nav-review .dp-phone .dp-section-label { display:flex; justify-content:space-between; margin:5px 0 7px; color:var(--dp-muted); font-size:11px; }
  #dp-nav-review .dp-phone .dp-section-label.dp-blocked { color:var(--dp-warn); }
  #dp-nav-review .dp-phone .dp-bottom { padding:8px; border-top:1px solid var(--dp-line); display:flex; gap:6px; background:var(--dp-surface); }
  #dp-nav-review .dp-phone .dp-bottom button { flex:1; font-size:11px; background:transparent; border-color:transparent; }
  #dp-nav-review .dp-phone .dp-bottom button[aria-current="page"] { color:var(--dp-accent); background:var(--dp-tint); }
  #dp-nav-review .dp-phone .dp-preview-note { padding:9px 16px; font-size:11px; color:var(--dp-muted); text-align:center; border-top:1px solid var(--dp-line); }
  #dp-nav-review .dp-phone .dp-return { border:0; padding:0; background:transparent; color:var(--dp-accent); justify-content:flex-start; }
  #dp-nav-review .dp-phone .dp-terminal-heading { display:flex; align-items:center; gap:10px; }
  #dp-nav-review .dp-phone .dp-terminal-heading strong { font-size:16px; }
  #dp-nav-review .dp-phone .dp-terminal-heading > button { flex:none; }
  #dp-nav-review .dp-phone .dp-context { font-size:11px; color:var(--dp-muted); overflow-wrap:anywhere; }
  #dp-nav-review .dp-phone .dp-terminal { background:var(--dp-surface); border:1px solid var(--dp-line); border-radius:10px; padding:15px 12px; min-height:285px; white-space:pre-wrap; overflow-wrap:anywhere; margin:0; font:12px/1.8 ui-monospace,SFMono-Regular,Menlo,monospace; }
  #dp-nav-review .dp-phone .dp-compose { display:flex; gap:6px; }
  #dp-nav-review .dp-phone .dp-compose input { flex:1; }
  #dp-nav-review .dp-phone .dp-compose button { flex:none; }
  #dp-nav-review .dp-phone .dp-siblings { display:flex; gap:7px; align-items:center; }
  #dp-nav-review .dp-phone .dp-siblings select { flex:1; font-size:12px; }
  #dp-nav-review .dp-phone .dp-siblings button { width:44px; flex:none; }
  #dp-nav-review .dp-phone .dp-menu { display:flex; flex-direction:column; gap:7px; padding:12px; border:1px solid var(--dp-line); background:var(--dp-surface); border-radius:12px; }
  #dp-nav-review .dp-phone .dp-menu button { width:100%; justify-content:flex-start; }
  #dp-nav-review .dp-phone .dp-danger { color:var(--dp-danger); }
  #dp-nav-review .dp-phone .dp-banner { border-left:2px solid var(--dp-accent); padding:7px 10px; background:var(--dp-tint); font-size:12px; overflow-wrap:anywhere; }
  #dp-nav-review .dp-phone .dp-form { display:flex; flex-direction:column; gap:14px; }
  #dp-nav-review .dp-phone .dp-form label { display:flex; flex-direction:column; gap:6px; }
  #dp-nav-review .dp-phone .dp-form-actions { display:flex; gap:8px; }
  #dp-nav-review .dp-phone .dp-form-actions button { flex:1; }
  #dp-nav-review .dp-phone .dp-setting { display:flex; flex-direction:column; gap:5px; padding:14px 12px; border-bottom:1px solid var(--dp-line); }
  #dp-nav-review .dp-phone .dp-setting:last-child { border-bottom:0; }
  #dp-nav-review .dp-phone .dp-window { padding:14px 12px; display:flex; flex-direction:column; gap:12px; border:1px solid var(--dp-line); border-radius:12px; background:var(--dp-surface); }
  #dp-nav-review .dp-phone .dp-window-actions { display:flex; gap:7px; flex-wrap:wrap; }
  #dp-nav-review .dp-phone .dp-window-actions button { flex:1; font-size:11px; }
  #dp-nav-review .dp-phone .dp-window-title { display:flex; flex-direction:column; gap:3px; }
  #dp-nav-review .dp-phone .dp-image { border:1px solid var(--dp-line); border-radius:10px; padding:17px; display:flex; flex-direction:column; gap:13px; background:var(--dp-surface); min-height:240px; }
  #dp-nav-review .dp-phone .dp-image-bar { height:7px; width:62%; background:var(--dp-line); border-radius:4px; }
  #dp-nav-review .dp-phone .dp-image-links { display:flex; gap:12px; border-bottom:1px solid var(--dp-line); padding-bottom:12px; font-size:11px; color:var(--dp-accent); }
  #dp-nav-review .dp-phone .dp-space-link { min-height:100px; border:1px solid var(--dp-line); border-radius:12px; width:100%; background:var(--dp-surface); text-align:left; justify-content:flex-start; padding:16px 12px; }
  #dp-nav-review .dp-phone .dp-tabs { display:flex; flex-wrap:wrap; gap:6px; }
  #dp-nav-review .dp-phone .dp-tabs button { font-size:11px; }
  #dp-nav-review .dp-phone .dp-tabs button[aria-pressed="true"] { color:var(--dp-accent); border-color:var(--dp-accent); }
  #dp-nav-review .dp-phone[data-sources="false"] .dp-origin { display:none; }
  #dp-nav-review .dp-phone .dp-group-heading { display:flex; align-items:center; padding-right:5px; }
  #dp-nav-review .dp-phone .dp-group-heading .dp-group-head { flex:1; }
  #dp-nav-review .dp-phone .dp-overflow { flex:none; width:44px; padding:8px; border:0; background:transparent; }
  #dp-nav-review .dp-phone .dp-tab-heading { display:flex; align-items:center; gap:6px; padding:3px 6px 0 12px; }
  #dp-nav-review .dp-phone .dp-tab-heading .dp-tab-name { padding:0; flex:1; }
  #dp-nav-review .dp-phone .dp-add-tab { width:100%; border:0; border-radius:0 0 12px 12px; color:var(--dp-accent); background:transparent; justify-content:flex-start; }
  #dp-nav-review .dp-phone .dp-menu strong { overflow-wrap:anywhere; }
  #dp-nav-review .dp-phone .dp-toolbar { display:flex; gap:6px; flex-wrap:wrap; }
  #dp-nav-review .dp-phone .dp-toolbar button { flex:1; font-size:11px; }
  #dp-nav-review .dp-phone .dp-form textarea { font:16px/1.5 ui-monospace,monospace; background:var(--dp-surface); color:var(--dp-ink); border:1px solid var(--dp-line); border-radius:9px; width:100%; min-height:110px; padding:10px; }
  #dp-nav-review .dp-phone .dp-confirm-actions { display:flex; flex-direction:column; gap:10px; }
  #dp-nav-review .dp-phone .dp-confirm-actions button { width:100%; }
  #dp-nav-review .dp-phone .dp-terminal { font-size:var(--dp-terminal-font,12px); }
  #dp-nav-review .dp-phone .dp-keys { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:5px; }
  #dp-nav-review .dp-phone .dp-keys button { padding:8px 3px; font-size:11px; }
  #dp-nav-review .dp-phone .dp-bottom { gap:1px; }
  #dp-nav-review .dp-phone .dp-bottom button { padding:8px 5px; }
  #dp-nav-review .dp-phone .dp-machine-row { display:flex; gap:7px; align-items:center; }
  #dp-nav-review .dp-phone .dp-machine-row select { flex:1; }
  #dp-nav-review .dp-phone .dp-machine-row button { width:44px; padding:8px; color:var(--dp-accent); }
  #dp-nav-review .dp-phone .dp-credential { color:var(--dp-accent); }
  #dp-nav-review .dp-phone .dp-section-label { align-items:center; gap:8px; }
  #dp-nav-review .dp-phone .dp-camera { min-height:190px; display:grid; place-items:center; border:1px dashed var(--dp-line); border-radius:12px; color:var(--dp-muted); text-align:center; padding:20px; }
  #dp-nav-review .dp-phone .dp-list { list-style:none; padding:0; margin:0; }
  #dp-nav-review .dp-phone .dp-list li { padding:12px 0; border-bottom:1px solid var(--dp-line); overflow-wrap:anywhere; }
  #dp-nav-review .dp-phone .dp-list li:last-child { border:0; }
  #dp-nav-review .dp-phone .dp-integration { display:flex; flex-direction:column; gap:8px; }
  #dp-nav-review .dp-phone .dp-integration-heading { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:8px 0 4px; }
  #dp-nav-review .dp-phone .dp-integration-heading h3 { font-size:16px; }
  #dp-nav-review .dp-phone .dp-integration-heading .dp-grow { min-width:90px; }
  #dp-nav-review .dp-phone .dp-integration-heading button { padding:8px; font-size:11px; }
  #dp-nav-review .dp-phone .dp-integration-heading .dp-herdr-title { color:var(--dp-accent); }
  #dp-nav-review .dp-phone .dp-integration-heading .dp-herdr-toggle { flex:1; flex-direction:column; align-items:flex-start; justify-content:center; text-align:left; border:0; padding:4px 0; background:transparent; }
  @media(max-width:380px) { #dp-nav-review .dp-stage { padding:12px 0 0; min-height:1170px; } #dp-nav-review .dp-phone { min-height:1140px; } #dp-nav-review .dp-phone .dp-main { padding:16px 12px; } }
</style>
<script>
(() => {
  const root=document.getElementById('dp-nav-review');
  const baseMachines=[{id:'omarchy',name:'Omarchy',desktop:true,herdr:true},{id:'laptop',name:'Laptop',desktop:true,herdr:false},{id:'build',name:'Build box',desktop:false,herdr:false}];
  const examples={
    omarchy:[
      {id:'nav',title:'Redesign mobile navigation',agent:'Codex',state:'blocked',path:'~/Projects/deskpilot',space:'deskpilot',tab:'mobile',provider:'Herdr',screen:4},
      {id:'checks',title:'Check attachment lifecycle',agent:'Claude',state:'working',path:'~/Projects/deskpilot',space:'deskpilot',tab:'mobile',provider:'Herdr',screen:4},
      {id:'a11y',title:'Review accessibility changes',agent:'Codex',state:'done',path:'~/Projects/deskpilot',space:'deskpilot',tab:'review',provider:'Herdr',screen:4},
      {id:'research',title:'Compare keyboard behavior',agent:'Codex',state:'done',path:'~/Projects/deskpilot',space:'research',tab:'notes',provider:'Herdr',screen:5},
      {id:'shell',title:'Project shell',agent:'Shell',state:'ready',path:'~/Projects/deskpilot',provider:'Deskpilot',screen:2}],
    laptop:[{id:'review',title:'Review authentication changes',agent:'Codex',state:'blocked',path:'~/Projects/api',provider:'Codex',screen:2},{id:'shell',title:'Project shell',agent:'Shell',state:'ready',path:'~/Projects/website',provider:'Deskpilot',screen:3},{id:'observe',title:'Explore search indexing',agent:'Claude',state:'working',path:'~/Projects/search',provider:'Local terminal',screen:4,viewOnly:true}],
    build:[{id:'deploy',title:'Deploy release',agent:'Codex',state:'blocked',path:'~/services/api',provider:'Deskpilot'},{id:'assets',title:'Build assets',agent:'Shell',state:'working',path:'~/services/web',provider:'Deskpilot'}]
  };
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const count=(n,name)=>`${n} ${name}${n===1?'':'s'}`;
  const button=(text,action,cls='',attrs='')=>`<button type="button" class="cursor-interaction ${cls}" data-action="${esc(action)}" ${attrs}>${text}</button>`;
  const status=t=>`<span class="dp-state dp-${t.state}">${({blocked:'Needs you',working:'Working',done:'Done',ready:'Ready'})[t.state]}</span>`;
  const states={};
  const saved=window.openai?.widgetState?.privateContent?.management??{};
  const store=()=>{try{window.openai?.setWidgetState?.({modelContent:{prototype:'Deskpilot management review',layouts:Object.fromEntries(Object.entries(states).map(([id,s])=>[id,{machine:s.machine,view:s.view}]))},privateContent:{management:Object.fromEntries(Object.entries(states).map(([id,s])=>[id,{machine:s.machine,density:s.density,sources:s.sources}]))}})?.catch(()=>{});}catch{}};
  root.querySelectorAll('.dp-phone').forEach(phone=>{
    const layout=phone.dataset.layout, prior=saved[layout]??{};
    const s=states[layout]={machine:baseMachines.some(m=>m.id===prior.machine)?prior.machine:'omarchy',view:'work',filter:'all',selected:'',space:'deskpilot',tab:'mobile',screen:4,menu:null,notice:'',from:null,collapsed:[],machines:baseMachines.map(m=>({...m})),added:[],closed:[],membership:{},spaceNames:{deskpilot:'Mobile app',research:'Research'},tabNames:{mobile:'Mobile UI',review:'Review',notes:'Notes'},termNames:{},spaceOrder:{},tabOrder:{},logs:{},drafts:{},credentials:{},devices:{},notifications:{},edit:null,pending:null,drawer:'',preview:false,previewItems:[{id:'navigation',title:'Mobile navigation',caption:'Grouped work layout',time:'Today · 4:20 PM'},{id:'keyboard',title:'Terminal keyboard',caption:'Composer and key toolbar',time:'Today · 3:45 PM'}],previewId:'navigation',zoom:false,big:false,locked:false,connection:'Connected',density:prior.density==='Compact'?'Compact':'Comfortable',sources:prior.sources!==false};
    const machine=()=>s.machines.find(m=>m.id===s.machine);
    const key=id=>s.machine+':'+id;
    const all=()=>[...(examples[s.machine]??[]),...s.added.filter(t=>t.machine===s.machine)].filter(t=>!s.closed.includes(key(t.id))).map(t=>({...t,...s.membership[key(t.id)],title:s.termNames[key(t.id)]||t.title}));
    const titleSpace=id=>s.spaceNames[key(id)]||s.spaceNames[id]||'New space';
    const titleTab=id=>s.tabNames[key(id)]||s.tabNames[id]||'New tab';
    const current=()=>all().find(t=>t.id===s.selected);
    const ordered=(ids,order)=>[...ids].sort((a,b)=>(order?.indexOf(a)===-1?999:order?.indexOf(a)??999)-(order?.indexOf(b)===-1?999:order?.indexOf(b)??999));
    const spaces=()=>ordered([...new Set(all().filter(t=>t.space).map(t=>t.space))],s.spaceOrder[s.machine]);
    const tabs=id=>ordered([...new Set(all().filter(t=>t.space===id).map(t=>t.tab))],s.tabOrder[key(id)]);
    const matching=()=>all().filter(t=>s.filter==='all'||t.state===s.filter);
    const context=t=>t.space?'Herdr / '+titleSpace(t.space)+' / '+titleTab(t.tab):t.path;
    const origin=t=>t.provider===t.agent?'':`<span class="dp-origin">${esc(t.provider)}</span>`;
    const here=()=>({view:s.view,space:s.space,tab:s.tab,screen:s.screen});
    const restore=place=>{if(place)Object.assign(s,place);else s.view='work';s.menu=null;s.drawer='';s.preview=false;};
    const back=(label='Settings',action='settings')=>button('‹ '+esc(label),action,'dp-return');
    const heading=(title,sub='')=>`<div><h2>${esc(title)}</h2>${sub?`<p class="dp-small dp-muted dp-heading-sub">${esc(sub)}</p>`:''}</div>`;
    const field=(label,name,value='',type='text',required=true)=>`<label>${label}<input type="${type}" name="${name}" value="${esc(value)}" ${required?'required':''} autocomplete="off" /></label>`;
    const select=(label,name,items,value)=>`<label>${label}<select name="${name}">${items.map(([id,label])=>`<option value="${esc(id)}" ${String(id)===String(value)?'selected':''}>${esc(label)}</option>`).join('')}</select></label>`;
    const form=(content,label='Save example',kind='edit')=>`<form class="dp-form" data-form="${kind}">${content}<div class="dp-form-actions">${button('Cancel','cancel-form')}<button type="submit" class="dp-primary cursor-interaction">${label}</button></div></form>`;
    const begin=(kind,extra={})=>{s.edit={kind,returnTo:here(),...extra};s.view='edit';s.menu=null;};
    const row=(t,details=true)=>button(`<span class="dp-grow"><strong class="dp-row-title">${esc(t.title)}</strong><span class="dp-meta">${esc(t.agent)} ${details||!t.space?origin(t):''}${t.viewOnly?'<span>View only</span>':''}</span>${details?`<span class="dp-meta">${esc(context(t))}</span>`:''}${status(t)}</span><span class="dp-arrow" aria-hidden="true">›</span>`,'open:'+t.id,'dp-row');
    const filters=()=>`<div class="dp-filter" aria-label="Work filters">${[['all','All'],['blocked','Needs you '+all().filter(t=>t.state==='blocked').length],['working','Working']].map(([id,label])=>button(label,'filter:'+id,'',`aria-pressed="${s.filter===id}"`)).join('')}</div>`;
    const overflow=(type,id)=>button('•••','menu:'+type+':'+id,'dp-overflow',`aria-label="${type==='space'?'Space':'Tab'} actions: ${esc(type==='space'?titleSpace(id):titleTab(id))}" aria-expanded="${s.menu?.kind===type&&s.menu.id===id}"`);
    function nativeMenu(kind,id){
      if(s.menu?.kind!==kind||s.menu.id!==id)return '';
      return `<div class="dp-menu"><strong>${esc(kind==='space'?titleSpace(id):titleTab(id))}</strong>${kind==='space'?button('+ Tab','create-tab:'+id)+button('Rename space','rename-space:'+id)+button('Reorder spaces','spaces'):button('+ Terminal in this tab','create-pane:'+id)+button('Rename tab','rename-tab:'+id)+button('Move tab to another space','move-tab:'+id)+button('Move tab earlier','reorder-tab:up:'+id)+button('Move tab later','reorder-tab:down:'+id)}${button('Close '+kind+'…','close-'+kind+':'+id,'dp-danger')}${button('Dismiss','dismiss')}</div>`;
    }
    const tabHeading=(space,tab)=>`<div class="dp-tab-heading"><span class="dp-tab-name">Tab · ${esc(titleTab(tab))}</span>${overflow('tab',tab)}</div>${nativeMenu('tab',tab)}`;
    function group(id,list){
      const collapsed=s.collapsed.includes(key(id))&&s.filter==='all';

      else if(kind==='reorder-tab')s.tabOrder[key(s.space)]=reorder(tabs(s.space),parts[1],parts[0]);
      else if(kind==='close-space'||kind==='close-tab'){s.pending={kind:kind==='close-space'?'space':'tab',space:kind==='close-space'?value:s.space,tab:value,returnTo:here()};s.view='confirm';s.menu=null;}
      else if(kind==='space'){s.space=value;s.tab=tabs(value)[0];s.view='space';s.menu=null;}
      else if(kind==='tab')s.tab=value;
      else if(kind==='open')openTerminal(value);
      else if(kind==='back')restore(s.from);
      else if(kind==='terminal-menu')s.menu=s.menu?null:{kind:'terminal'};
      else if(kind==='terminal-panel')s.preview=false;
      else if(kind==='preview-panel')s.preview=true;
      else if(kind==='prev'||kind==='next'){const list=siblings(),n=list.findIndex(t=>t.id===s.selected)+(kind==='next'?1:-1);if(list[n])s.selected=list[n].id;s.menu=null;s.preview=false;s.drawer='';}
      else if(kind==='disconnect'){restore(s.from);s.notice='Mobile view disconnected. The original program keeps running.';}
      else if(kind==='details')s.notice=current().provider+' · '+current().path+(current().screen?' · Desktop screen '+current().screen:' · No desktop window');
      else if(kind==='rename-terminal')begin('rename-terminal');
      else if(kind==='open-desktop')begin('open-desktop',{id:s.selected});
      else if(kind==='end'){s.pending={kind:'terminal',returnTo:here()};s.view='confirm';s.menu=null;}
      else if(kind==='cancel-confirm')restore(s.pending.returnTo);
      else if(kind==='confirm-action'){
        const p=s.pending;
        if(['space','tab','terminal'].includes(p.kind)){s.closed.push(...affected(p).map(t=>key(t.id)));s.view='work';s.notice='Example work closed.';}
        else if(p.kind==='revoke'){const device=getDevices().find(d=>d.id===p.id);s.devices[s.machine]=getDevices().filter(d=>d.id!==p.id);s.view='devices';s.notice=device.current?'This example device was revoked. Re-pair to regain access.':'Example device revoked.';if(device.current)s.connection='Pairing required';}
        else if(p.kind==='forget'){s.machines=s.machines.filter(m=>m.id!==p.id);if(s.machine===p.id)s.machine=s.machines[0].id;s.view='machines';s.notice='Machine forgotten from this example.';}
        else if(p.kind==='preview'){s.previewItems=s.previewItems.filter(x=>x.id!==p.id);s.view='previews';}
      }
      else if(kind==='cancel-form')restore(s.edit?.returnTo||{view:'machines'});
      else if(kind==='pair'||kind==='repair-pair'){s.repairing=kind==='repair-pair';s.edit=null;s.view='pair';s.scanning=false;s.pairAddress='';s.pairCode='';}
      else if(kind==='scan')s.scanning=!s.scanning;
      else if(kind==='example-qr'){s.pairAddress='https://new-workstation.example.ts.net';s.pairCode='EXAMPLE-CODE';s.scanning=false;}
      else if(kind==='rename-machine')begin('rename-machine',{id:value});
      else if(kind==='reset-machine'){s.machines.find(m=>m.id===value).name=baseMachines.find(m=>m.id===value)?.name||'Workstation';}
      else if(kind==='forget-machine'){if(s.machines.length===1)s.notice='Keep at least one machine paired.';else{s.pending={kind:'forget',id:value,returnTo:here()};s.view='confirm';}}
      else if(kind==='rename-device')begin('rename-device',{id:value});
      else if(kind==='revoke-device'){s.pending={kind:'revoke',id:value,returnTo:here()};s.view='confirm';}
      else if(kind==='re-pair')begin('re-pair');
      else if(kind==='own-credential'){s.credentials[s.machine]=true;s.notice='Example device now has its own revocable credential.';}
      else if(kind==='notify-toggle')s.notifications[s.machine]=s.notifications[s.machine]===false;
      else if(kind==='notify-test')s.notice='Example test notification queued for this device.';
      else if(kind==='notify-repair'){s.notifications[s.machine]=true;s.notice='Example delivery registration repaired.';}
      else if(kind==='refresh-usage')s.notice='Example usage refreshed; stale collector data would be labeled here.';
      else if(kind==='install-help')s.installHelp=!s.installHelp;
      else if(kind==='retry'){s.connection='Connected';s.notice='Example connection refreshed.';}
      else if(kind==='text-size')s.big=!s.big;
      else if(['copy','paste','keys'].includes(kind))s.drawer=s.drawer===kind?'':kind;
      else if(kind==='close-drawer')s.drawer='';
      else if(kind==='select-output'){phone.querySelector('textarea[aria-label="Terminal output to copy"]')?.select();return;}
      else if(kind==='key'){s.logs[key(s.selected)]=(s.logs[key(s.selected)]||'')+'\n[key: '+value+']';}
      else if(kind==='refresh-previews')s.notice='Example preview history refreshed.';
      else if(kind==='select-preview')s.previewId=value;
      else if(kind==='zoom')s.zoom=!s.zoom;
      else if(kind==='remove-preview'){s.pending={kind:'preview',id:value,returnTo:here()};s.view='confirm';}
      else if(kind==='screen-prev'||kind==='screen-next'){s.screen=Math.max(1,Math.min(10,s.screen+(kind==='screen-next'?1:-1)));s.preview=false;}
      else if(kind==='inspect')s.preview=!s.preview;
      else if(kind==='tile'){s.tiled=true;s.notice='Example window tiled.';}
      else if(kind==='move-window')begin('move-window',{id:value});
      render();store();
    });
    phone.addEventListener('input',e=>{if(e.target.name==='prompt')s.drafts[key(s.selected)]=e.target.value;});
    phone.addEventListener('change',e=>{
      const el=e.target;
      if(el.matches('[aria-label="Machine"]')){s.machine=el.value;s.view='work';s.filter='all';s.menu=null;s.drawer='';s.notice='';s.screen=s.machine==='laptop'?2:4;s.connection='Connected';}
      else if(el.matches('[aria-label="Terminal in current group"]')){s.selected=el.value;s.drawer='';s.menu=null;}
      else if(el.matches('[aria-label="Desktop workspace"]')){s.screen=Number(el.value);s.preview=false;}
      else if(el.name==='agent'){
        const presets={Codex:'codex --no-alt-screen','Codex continue':'codex resume --last --no-alt-screen','Codex yolo':'codex --yolo --no-alt-screen',Claude:'claude','Claude continue':'claude --continue',Shell:'bash',Custom:''};
        el.form.elements.command.value=presets[el.value];let warning=el.form.querySelector('[data-yolo]');if(warning)warning.remove();if(el.value==='Codex yolo'){warning=document.createElement('p');warning.dataset.yolo='';warning.className='dp-banner';warning.textContent='Yolo mode disables approval prompts and sandboxing. This prototype does not launch any command.';el.after(warning);}return;
      } else return;
      render();store();
    });
    phone.addEventListener('submit',e=>{
      e.preventDefault();const f=e.target,data=new FormData(f),kind=f.dataset.form;s.notice='';
      if(kind==='send'){const text=String(data.get('prompt')||'').trim();if(!text)return;s.logs[key(s.selected)]=(s.logs[key(s.selected)]||'')+'\nYou: '+text+'\nExample reply received.';s.drafts[key(s.selected)]='';}
      else if(kind==='paste'){s.drafts[key(s.selected)]=(s.drafts[key(s.selected)]||'')+String(data.get('paste')||'');s.drawer='';s.notice='Inserted without sending.';}
      else if(kind==='unlock'){s.locked=false;s.notice='Example desktop unlocked.';}
      else if(kind==='pair'){
        if(!String(data.get('code')||'').trim()&&!String(data.get('address')).includes('code=')){s.notice='Enter a pairing code or use the example QR result.';render();return;}
        if(!s.repairing){const id='paired-'+s.machines.length;s.machines.push({id,name:String(data.get('name')),desktop:true,herdr:false});s.machine=id;}
        s.connection='Connected';s.view='machines';s.notice='Example pairing complete.';s.scanning=false;s.pairCode='';s.pairAddress='';
      } else if(kind==='edit'){
        const edit=s.edit,name=String(data.get('name')||'').trim();
        if(['space','tab','pane','terminal'].includes(edit.kind)){
          const id='created-'+s.added.length, runtime=String(data.get('runtime')||''),space=edit.kind==='space'?'space-'+id:edit.kind==='tab'?String(data.get('space')):edit.kind==='pane'?edit.space:runtime.startsWith('space:')?runtime.slice(6):null;
          const tab=edit.kind==='pane'?edit.tab:space?'tab-'+id:null;
          if(edit.kind==='space')s.spaceNames[key(space)]=name;
          if(tab&&edit.kind!=='pane')s.tabNames[key(tab)]=edit.kind==='space'?'Terminal':name;
          const agent=String(data.get('agent')).split(' ')[0];s.added.push({id,machine:s.machine,title:edit.kind==='space'?'Project terminal':name,agent:agent==='Custom'?'Terminal':agent,state:'ready',path:String(data.get('folder')),provider:space?'Herdr':'Deskpilot',space,tab,screen:data.get('screen')?Number(data.get('screen')):undefined});
          if(edit.kind==='space'){s.space=space;s.tab=tab;s.view='space';}
          else if(['tab','pane'].includes(edit.kind)){s.space=space;s.tab=tab;restore(edit.returnTo);if(s.view==='space'){s.space=space;s.tab=tab;}}
          else{restore(edit.returnTo);openTerminal(id);}
          s.notice='Example '+edit.kind+' created.';
        }else{
          if(edit.kind==='rename-space')s.spaceNames[key(edit.space)]=name;
          else if(edit.kind==='rename-tab')s.tabNames[key(edit.tab)]=name;
          else if(edit.kind==='move-tab'){const destination=String(data.get('space'));all().filter(t=>t.space===edit.space&&t.tab===edit.tab).forEach(t=>s.membership[key(t.id)]={...s.membership[key(t.id)],space:destination,tab:t.tab});}
          else if(edit.kind==='rename-machine')s.machines.find(m=>m.id===edit.id).name=name;
          else if(edit.kind==='rename-device')getDevices().find(d=>d.id===edit.id).name=name;
          else if(edit.kind==='re-pair'){s.credentials[s.machine]=true;s.connection='Connected';}
          else if(edit.kind==='rename-terminal')s.termNames[key(s.selected)]=name;
          else if(edit.kind==='move-window'||edit.kind==='open-desktop'){s.membership[key(edit.id)]={...s.membership[key(edit.id)],screen:Number(data.get('screen'))};}
          restore(edit.returnTo);s.notice='Example change saved.';
        }
      }
      render();store();
    });
    render();
    if(globalThis.Tweak){const tweak=new Tweak({container:phone,onChange:()=>{render();store();}});tweak.addSelect(s,'density',{label:'Row spacing',options:['Compact','Comfortable']});tweak.addToggle(s,'sources',{label:'Show connection source'});tweak.addSelect(s,'connection',{label:'Example connection state',options:['Connected','Offline','Pairing required']});tweak.addToggle(s,'locked',{label:'Example desktop locked'});}
  });
})();
</script>
